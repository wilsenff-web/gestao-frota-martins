<script>
(function(){function positionHeader(){const app=document.getElementById('application');if(!app||app.hidden)return;const admin=!document.body.classList.contains('driver-mode')&&innerWidth>900;const top=document.getElementById('adm-topbar');const clock=document.getElementById('martins-clock'),status=document.getElementById('online-status');if(!top||!clock||!status)return;if(admin){document.getElementById('adm-topbar-clock').appendChild(clock);document.getElementById('adm-topbar-status').appendChild(status);/* A marca ADM é renderizada diretamente por renderBrand; não mover o nó do menu. */}else{app.insertBefore(clock,top.nextSibling);app.insertBefore(status,clock.nextSibling);const brand=document.getElementById('app-brand'),aside=app.querySelector('aside');if(brand&&aside)aside.insertBefore(brand,aside.firstChild)}}document.addEventListener('DOMContentLoaded',()=>{positionHeader();new MutationObserver(positionHeader).observe(document.getElementById('application'),{attributes:true,attributeFilter:['hidden']});new MutationObserver(positionHeader).observe(document.body,{attributes:true,attributeFilter:['class']});window.addEventListener('resize',positionHeader);new MutationObserver(()=>{if(!document.getElementById('application').hidden)positionHeader()}).observe(document.getElementById('adm-topbar-brand'),{childList:true})});})();
</script>
<script>
(function(){
 const dateEl=document.getElementById('martins-date'),timeEl=document.getElementById('martins-time');
 if(!dateEl||!timeEl)return;
 const dateFmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const timeFmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 function tick(){const now=new Date();dateEl.textContent=dateFmt.format(now);timeEl.textContent=timeFmt.format(now)}
 tick();setInterval(tick,1000);
})();
</script>

<script>
/* Verificação de versão para PWA instalado (PC, Android e iOS). */
(function(){
 const BUILD='20261128-grafico-semanal-25',BASE='./sw.js',KEY='frota_martins_build';
 let checking=false,reloading=false,lastCheck=0;
 const stored=()=>{try{return localStorage.getItem(KEY)}catch(_){return null}};
 const save=v=>{try{localStorage.setItem(KEY,v)}catch(_){}};
 function reload(target=BUILD){if(reloading)return;reloading=true;const u=new URL(location.href);u.searchParams.set('versao',target);u.searchParams.set('recarregar',String(Date.now()));location.replace(u.href)}
 async function check(force=false){
  if(checking||reloading||!navigator.onLine)return;
  if(!force&&Date.now()-lastCheck<60000)return;
  checking=true;lastCheck=Date.now();
  try{
   const response=await fetch(BASE+'?verificar='+Date.now(),{cache:'no-store'});
   if(!response.ok)throw new Error('Versão indisponível');
   const source=await response.text(),match=source.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
   if(!match)return;
   const latest=match[1],previous=stored();
   if(latest!==BUILD){save(latest);reload(latest);return}
   if(previous!==latest)save(latest);
   if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}
  }catch(err){console.warn('Verificação de versão:',err)}
  finally{checking=false}
 }
 window.frotaCheckUpdate=check;
 if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading)reload()});
  window.addEventListener('load',async()=>{
   try{const reg=await navigator.serviceWorker.register(BASE,{updateViaCache:'none'});await reg.update()}catch(err){console.warn('Service Worker:',err)}
   check(true);
  });
 }else window.addEventListener('load',()=>check(true));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)check(true)});
 window.addEventListener('pageshow',event=>{if(event.persisted)check(true)});
 window.addEventListener('online',()=>check(true));
 window.addEventListener('focus',()=>check());
})();
</script>

<script>
(function(){
 const btn=document.getElementById('app-refresh-control');if(!btn)return;
 btn.addEventListener('click',async()=>{
  if(btn.disabled)return;btn.disabled=true;btn.textContent='Verificando atualização…';
  try{
   if(typeof window.frotaCheckUpdate==='function')await window.frotaCheckUpdate(true);
   if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}
   if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('frota-martins-shell-')).map(k=>caches.delete(k)))}
  }catch(err){console.warn('Atualização:',err)}
  const url=new URL(location.href);url.searchParams.set('atualizar',String(Date.now()));location.replace(url.href);
 });
})();
</script>

<script>
(function(){
 const app=document.getElementById('application'),button=document.getElementById('app-refresh-control'),version=document.getElementById('app-version-label');
 if(!app||!button||!version)return;
 const group=document.createElement('div');group.id='app-update-group';
 const move=()=>{
  const aside=app.querySelector('.app aside'),isAdmin=!(document.body.classList.contains('driver-mode'));
  if(isAdmin&&document.getElementById('adm-account-update')){const target=document.getElementById('adm-account-update');if(button.parentElement!==target)target.append(button,version);group.remove();return;}
  if(window.innerWidth>900&&isAdmin&&aside){
   const account=aside.querySelector('#account-nav');if(account){if(group.parentElement!==aside||group.nextElementSibling!==account)aside.insertBefore(group,account)}else if(group.parentElement!==aside)aside.appendChild(group);
   group.append(button,version);
  }else if(group.contains(button)){
   app.insertBefore(button,app.querySelector('.app'));
   app.insertBefore(version,app.querySelector('.app'));
   group.remove();
  }
 };
 move();window.addEventListener('resize',move);new MutationObserver(move).observe(document.body,{attributes:true,attributeFilter:['class']});
})();
</script>
