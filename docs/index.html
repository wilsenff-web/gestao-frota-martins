<script>
(function(){
 const dateEl=document.getElementById('martins-date'),timeEl=document.getElementById('martins-time');
 if(!dateEl||!timeEl)return;
 const dateFmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const timeFmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 function tick(){const now=new Date();dateEl.textContent=dateFmt.format(now);timeEl.textContent=timeFmt.format(now)}
 tick();setInterval(tick,1000);
})();
</script>

<script>
(function(){
 function sync(){const isLight=document.body.classList.contains('light');let meta=document.querySelector('meta[name="theme-color"]:not([media])');if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta)}meta.content=isLight?'#f4f2ed':'#0d0d10'}
 document.addEventListener('DOMContentLoaded',()=>{sync();new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['class']})});
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol==='https:'){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
   reg.update().catch(()=>{});
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(console.warn);
 });
}
</script>
<style>
#app-refresh-control{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin:6px 10px;padding:7px 12px;border:1px solid #c99b22;border-radius:12px;background:#ffcc24;color:#221900;font:700 13px system-ui,-apple-system,sans-serif;cursor:pointer;vertical-align:middle}

<script>
(function(){
 const btn=document.getElementById('app-refresh-control');if(!btn)return;
 btn.addEventListener('click',async function(){
  if(btn.disabled)return;btn.disabled=true;btn.textContent='Atualizando…';
  try{
   if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await Promise.race([reg.update(),new Promise(resolve=>setTimeout(resolve,3500))]);}
   if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('frota-martins-shell-')).map(k=>caches.delete(k)));}
  }catch(err){console.warn('Atualização do app:',err)}
  const url=new URL(location.href);url.searchParams.set('atualizar',String(Date.now()));
  location.replace(url.href);
 });
})();
</script>
