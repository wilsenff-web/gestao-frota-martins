<script>
(function(){
 const dateEl=document.getElementById('martins-date'),timeEl=document.getElementById('martins-time');
 if(!dateEl||!timeEl)return;
 const dateFmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const timeFmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 function tick(){const now=new Date();dateEl.textContent=dateFmt.format(now);timeEl.textContent=timeFmt.format(now)}
 tick();setInterval(tick,1000);
})();
</script>
